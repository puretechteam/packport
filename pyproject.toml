[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packport"
dynamic = ["version"]
description = "Write RAR, Unix compress (.Z) and CPIO archives in pure Python. No WinRAR, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pure Tech" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["rar", "cbr", "compress", "lzw", "cpio", "archive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
packport = "packport.__main__:main"

[project.urls]
Source = "https://github.com/puretechteam/packport"

[tool.setuptools.dynamic]
version = { attr = "packport.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: writes and extracts a file over 4 GB (run with PACKPORT_SLOW=1)"]
