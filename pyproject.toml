[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packport"
dynamic = ["version"]
description = "Read RAR, 7z, ZIP, CAB, WIM, ISO, UDF, disk images and more, and write RAR, WIM, .Z and CPIO, in pure Python. No 7-Zip, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pure Tech" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["rar", "cbr", "7z", "zip", "cab", "wim", "iso", "udf", "vhd", "vmdk", "dmg", "squashfs", "compress", "lzw", "cpio", "archive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17", "backports.zstd>=1.0; python_version < '3.14'", "lz4>=4"]

[project.scripts]
packport = "packport.__main__:main"

[project.urls]
Source = "https://github.com/puretechteam/packport"

[tool.setuptools.dynamic]
version = { attr = "packport.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Any warning fails a test: each one is either fixed or listed here with the reason.
filterwarnings = ["error"]
markers = ["slow: writes and extracts a file over 4 GB (run with PACKPORT_SLOW=1)"]
