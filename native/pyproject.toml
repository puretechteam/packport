[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "packport-native"
version = "0.3.0"
description = "Compiled decoders for packport: the same results, much faster. Optional: packport works without them."
license = "MIT"
authors = [{ name = "Pure Tech" }]
requires-python = ">=3.10"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.urls]
Source = "https://github.com/puretechteam/packport"

[tool.maturin]
module-name = "packport_native"
features = ["extension-module"]
